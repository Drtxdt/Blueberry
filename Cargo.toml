[package]
name = "blueberry"
version = "0.5.0-beta.6"
edition = "2024"
rust-version = "1.94"
description = "A native, low-latency completion host for PowerShell"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.25"
unicode-width = "0.2"
unicode-segmentation = "1"
vt100 = "0.16.2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
notify = "8.2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_System_ProcessStatus", "Win32_System_Console", "Win32_System_Pipes"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[[bin]]
name = "blueberry"
path = "src/main.rs"
