# ShellSense configuration

[ui]
max_rows = 8
width = 80
descriptions = true
border = "rounded" # "rounded", "square", or "none"
icons = true
foreground = "default"
background = "default"
selected_foreground = "#ffffff"
selected_background = "#264f78"
border_color = "#6688aa"
description_color = "#8f9baa"
match_color = "#ffcc66"

[completion]
max_results = 100
auto_trigger = true

[descriptions]
# Optional overrides; keys distinguish command scopes and option case.
# "git log --oneline" = "每条提交显示为一行"
# "cargo" = "构建项目并管理 Rust 依赖"
# "mytool" = "运行我的本地工具"
