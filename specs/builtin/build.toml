[[nodes]]
path = "go"
description = "构建和管理 Go 项目"
detail = "运行、构建、测试 Go 模块与工作区。"
positional = "none"
children = ["run", "build", "test", "list", "mod", "work"]
option_sets = ["BLUEBERRY_COMMON_HELP"]
keywords = ["Go 项目", "构建", "测试"]
examples = ["go test ./..."]

[[nodes]]
path = "go run"
description = "运行 Go 程序"
detail = "运行当前项目中的 Go 文件或包。"
positional = "path"
provider = "go.files"
examples = ["go run main.go"]

[[nodes]]
path = "go build"
description = "构建 Go 包"
detail = "编译当前模块的包和命令。"
positional = "value"
provider = "go.packages"
examples = ["go build ./..."]

[[nodes]]
path = "go test"
description = "运行 Go 测试"
detail = "运行当前模块中指定包的测试。"
positional = "value"
provider = "go.packages"
keywords = ["测试"]
examples = ["go test ./..."]

[[nodes]]
path = "go list"
description = "列出 Go 包"
detail = "列出匹配模式的 Go 包。"
positional = "value"
provider = "go.packages"
examples = ["go list ./..."]

[[nodes]]
path = "go mod"
description = "管理 Go 模块"
detail = "初始化、整理和编辑 go.mod。"
positional = "value"
examples = ["go mod tidy"]

[[nodes]]
path = "go work"
description = "管理 Go 工作区"
detail = "管理由 go.work 连接的多个 Go 模块。"
positional = "value"
provider = "go.workspaces"
examples = ["go work use ./module"]

[[nodes]]
path = "cmake"
description = "配置和构建 CMake 项目"
detail = "使用源码目录、构建目录或预设配置 CMake 项目。"
positional = "directory"
children = ["--build", "--install", "--workflow"]
options = [{ name = "--preset", description = "选择配置预设", detail = "选择 CMakePresets.json 中的配置预设。", value_kind = "text", provider = "cmake.presets", value_name = "PRESET" }, { name = "--build", description = "构建生成目录", detail = "构建已经配置的 CMake 生成目录。", value_kind = "directory", value_name = "DIR" }]
keywords = ["CMake", "配置", "构建"]
examples = ["cmake --preset windows-debug"]

[[nodes]]
path = "cmake --build"
description = "构建 CMake 生成目录"
detail = "调用生成器构建已经配置的目录。"
positional = "directory"
options = [{ name = "--preset", description = "选择构建预设", detail = "选择 CMakePresets.json 中的构建预设。", value_kind = "text", provider = "cmake.build_presets", value_name = "PRESET" }, { name = "--target", names = ["-t"], description = "选择构建目标", detail = "只构建指定目标。", value_kind = "text", provider = "cmake.targets", value_name = "TARGET" }]
examples = ["cmake --build --preset windows-debug"]

[[nodes]]
path = "cmake --install"
description = "安装 CMake 构建产物"
detail = "执行当前生成目录的安装规则。"
positional = "directory"
examples = ["cmake --install build"]

[[nodes]]
path = "cmake --workflow"
description = "运行 CMake 工作流预设"
detail = "按工作流预设依次执行配置、构建和测试步骤。"
positional = "value"
provider = "cmake.presets"
examples = ["cmake --workflow --preset ci"]

[[nodes]]
path = "ctest"
description = "运行 CMake 测试"
detail = "在 CMake 构建目录中选择并运行测试。"
positional = "none"
option_sets = ["BLUEBERRY_COMMON_HELP"]
options = [{ name = "--preset", description = "选择测试预设", detail = "选择 CMakePresets.json 中的测试预设。", value_kind = "text", provider = "cmake.test_presets", value_name = "PRESET" }, { name = "--test-dir", description = "指定构建目录", detail = "从指定构建目录读取并运行测试。", value_kind = "directory", value_name = "DIR" }]
keywords = ["CMake 测试", "运行测试"]
examples = ["ctest --preset unit"]

