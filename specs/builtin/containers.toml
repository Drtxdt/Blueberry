[[nodes]]
path = "helm upgrade"
description = "升级 Helm release"
detail = "使用新的 Chart 或 values 更新现有 release。"
positional = "value"
provider = "helm.releases"
examples = ["helm upgrade api ./chart"]

[[nodes]]
path = "helm uninstall"
description = "卸载 Helm release"
detail = "从集群移除指定 Helm release。"
positional = "value"
provider = "helm.releases"
examples = ["helm uninstall api"]

[[nodes]]
path = "helm template"
description = "在本地渲染 Chart"
detail = "渲染 Kubernetes 清单但不连接集群安装。"
positional = "path"
provider = "helm.charts"
examples = ["helm template api ./chart"]

[[nodes]]
path = "helm lint"
description = "检查 Helm Chart"
detail = "检查 Chart 结构和值是否符合要求。"
positional = "path"
provider = "helm.charts"
examples = ["helm lint ./chart"]

[[nodes]]
path = "helm repo"
description = "管理 Helm 仓库"
detail = "添加、更新和列出本机 Helm 仓库。"
positional = "value"
provider = "helm.repositories"
examples = ["helm repo list"]

