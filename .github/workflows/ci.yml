name: Blueberry CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: python3 -m unittest discover -s tests -p test_release_evidence.py
  core:
    name: Core / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Core tests (no interactive shell)
        run: cargo test --locked --lib --test cli --test commands_store --test engine --test packs_cli --test providers --test specs --test knowledge -- --test-threads=1
      - run: cargo run --locked -- --version
      - run: cargo run --locked -- specs check
  powershell-51:
    name: Windows PowerShell 5.1 / PSReadLine ${{ matrix.psreadline }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        psreadline: ['2.0.0', '2.4.5']
    env:
      BLUEBERRY_NO_HISTORY: '1'
      BLUEBERRY_TEST_SHELL: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Select exact PSReadLine version
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'blueberry-modules'
          Save-Module PSReadLine -RequiredVersion '${{ matrix.psreadline }}' -Path $root -Repository PSGallery -Force
          $manifest = Join-Path $root 'PSReadLine/${{ matrix.psreadline }}/PSReadLine.psd1'
          "BLUEBERRY_TEST_PSREADLINE_MODULE=$manifest" >> $env:GITHUB_ENV
          & $env:BLUEBERRY_TEST_SHELL -NoProfile -NonInteractive -Command "Import-Module '$manifest' -Force; if ((Get-Module PSReadLine).Version.ToString() -ne '${{ matrix.psreadline }}') { exit 1 }; Get-Module PSReadLine | Select Name,Version,Path"
          if ($LASTEXITCODE -ne 0) { throw 'PSReadLine version mismatch' }
      - name: Adapter regressions
        shell: pwsh
        run: |
          & $env:BLUEBERRY_TEST_SHELL -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/adapter.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'adapter regressions failed' }
      - name: Startup regressions
        shell: pwsh
        run: |
          & $env:BLUEBERRY_TEST_SHELL -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/startup.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'startup regressions failed' }
      - name: OSC ConPTY regressions
        shell: pwsh
        env:
          BLUEBERRY_TEST_TRANSPORT: osc
        run: |
          cargo test --locked --test host --test startup_host --test terminal_beta --test terminal_modes --test hub_terminal -- --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'OSC terminal regressions failed' }
      - name: Pipe ConPTY regressions
        shell: pwsh
        env:
          BLUEBERRY_TEST_TRANSPORT: pipe
        run: |
          cargo test --locked --test host --test startup_host --test terminal_beta --test terminal_modes --test hub_terminal -- --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'pipe terminal regressions failed' }
      - name: Direct inherited-console regressions
        shell: pwsh
        run: |
          cargo test --locked --test direct_terminal -- --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'direct terminal regressions failed' }
  powershell-7:
    name: PowerShell 7 / PSReadLine 2.4.5 / ${{ matrix.transport }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        transport: [osc, pipe]
    env:
      BLUEBERRY_NO_HISTORY: '1'
      BLUEBERRY_TEST_SHELL: pwsh.exe
      BLUEBERRY_TEST_TRANSPORT: ${{ matrix.transport }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Select exact PSReadLine version
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'blueberry-modules'
          Save-Module PSReadLine -RequiredVersion '2.4.5' -Path $root -Repository PSGallery -Force
          $manifest = Join-Path $root 'PSReadLine/2.4.5/PSReadLine.psd1'
          "BLUEBERRY_TEST_PSREADLINE_MODULE=$manifest" >> $env:GITHUB_ENV
          Import-Module $manifest -Force
          if ((Get-Module PSReadLine).Version.ToString() -ne '2.4.5') { throw 'PSReadLine version mismatch' }
          $PSVersionTable.PSVersion.ToString()
      - name: Adapter and startup regressions
        shell: pwsh
        run: |
          ./tests/adapter.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'adapter regressions failed' }
          ./tests/startup.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'startup regressions failed' }
      - name: Real ConPTY interaction
        shell: pwsh
        run: |
          cargo test --locked --test host --test startup_host --test terminal_beta --test terminal_modes --test hub_terminal -- --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7 ConPTY regressions failed' }
      - name: Direct inherited-console regressions
        if: matrix.transport == 'pipe'
        shell: pwsh
        run: |
          cargo test --locked --test direct_terminal -- --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'direct terminal regressions failed' }
  native-mouse:
    name: Native ConPTY mouse / windows-2025
    runs-on: windows-2025
    env:
      BLUEBERRY_NO_HISTORY: '1'
      BLUEBERRY_TEST_SHELL: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native mouse records through nested ConPTY
        shell: pwsh
        run: |
          foreach ($transport in @('osc', 'pipe')) {
            $env:BLUEBERRY_TEST_TRANSPORT = $transport
            cargo test --locked --test terminal_modes conpty_native_mouse_passthrough_for_external_program -- --exact --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { throw "$transport native mouse regression failed" }
          }
  package:
    needs: [format, core, powershell-51, powershell-7, native-mouse]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked sources for offline license collection
        run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - run: cargo build --release --locked
      - name: Package and validate installation
        shell: pwsh
        run: |
          ./scripts/licenses.ps1 -OutputPath ./THIRD-PARTY-NOTICES.txt
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          ./scripts/release.ps1 -ExePath ./target/release/blueberry.exe -Version $version -OutputDirectory ./dist/ci
          ./scripts/test-release.ps1 -BlueberryExecutable ./target/release/blueberry.exe
          $package = (Get-ChildItem ./dist/ci/*.zip).FullName
          ./scripts/test-install-51.ps1 -PackagePath $package
          ./scripts/test-download.ps1 -PackagePath $package
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/test-download.ps1 -PackagePath $package
          if ($LASTEXITCODE -ne 0) { throw '5.1 download selection tests failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: blueberry-windows-x64
          path: |
            dist/ci/*.zip
            dist/ci/*.sha256
            dist/ci/*-release.json
            install.ps1
          if-no-files-found: error
