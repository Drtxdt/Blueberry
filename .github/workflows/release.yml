name: Blueberry release draft
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated release tag pointing to the measured source commit
        required: true
        type: string
      ci_run_id:
        description: Successful main CI run whose immutable package was measured
        required: true
        type: string
      evidence_ref:
        description: Commit containing version-bound release evidence and raw reports
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0
      - name: Validate tag, version and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || { echo 'Unexpected release tag' >&2; exit 1; }
          echo "EVIDENCE_PATH=docs/benchmarks/v0.5/$RELEASE_TAG-release-evidence.json" >> "$GITHUB_ENV"
          echo "VALIDATION_PATH=docs/$RELEASE_TAG-validation.md" >> "$GITHUB_ENV"
          git fetch origin main:refs/remotes/origin/main
          # Resolve main once. Subsequent pushes must not change this run's evidence.
          echo "EVIDENCE_REF=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          TAG_SHA="$(git rev-parse HEAD)"
          [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" == tag ]] || { echo 'Expected an annotated release tag' >&2; exit 1; }
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$TAG_SHA" ]]
          git merge-base --is-ancestor "$TAG_SHA" origin/main
          echo "TAG_SHA=$TAG_SHA" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          with open('Cargo.toml', 'rb') as f:
              version = tomllib.load(f)['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match Cargo.toml'
          section = re.search(r'^## ' + re.escape(version) + r'\s*\n(.*?)(?=^## |\Z)', Path('CHANGELOG.md').read_text(), re.M | re.S)
          assert section, 'Missing release notes'
          Path('release-notes.md').write_text('# Blueberry ' + version + '\n\n' + section[1].strip() + '\n')
          PY
      - name: Resolve exact CI run from pinned version evidence
        env:
          MANUAL_EVIDENCE_REF: ${{ inputs.evidence_ref }}
          MANUAL_CI_RUN_ID: ${{ inputs.ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$MANUAL_EVIDENCE_REF" ]]; then
            EVIDENCE_REF="$(git rev-parse "$MANUAL_EVIDENCE_REF^{commit}")"
          fi
          git merge-base --is-ancestor "$EVIDENCE_REF" origin/main
          git show "$EVIDENCE_REF:$EVIDENCE_PATH" > pinned-evidence.json
          export EVIDENCE_REF
          python3 - <<'PY'
          import json, os
          evidence = json.load(open('pinned-evidence.json'))
          assert 'v' + evidence['version'] == os.environ['RELEASE_TAG'], 'Evidence version mismatch'
          assert evidence['source_commit'] == os.environ['TAG_SHA'], 'Evidence source mismatch'
          run_id = str(evidence['ci']['run_id'])
          assert run_id.isdigit(), 'Invalid evidence CI run ID'
          manual = os.environ['MANUAL_CI_RUN_ID']
          assert not manual or manual == run_id, 'Manual CI run differs from pinned evidence'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CI_RUN_ID=' + run_id + '\nEVIDENCE_REF=' + os.environ['EVIDENCE_REF'] + '\n')
          PY
      - name: Confirm the measured CI run belongs to this tag commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > ci-run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('ci-run.json'))
          assert run['head_sha'] == os.environ['TAG_SHA'], 'CI run belongs to another source commit'
          assert run['name'] == 'Blueberry CI' and run['event'] == 'push', 'Expected a branch CI run'
          assert run['head_branch'] == 'main' and run['conclusion'] == 'success', 'main CI did not pass'
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_REF }}
          fetch-depth: 0
          path: release-evidence
      - name: Confirm evidence commit follows the tagged source
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_SHA="$(git -C release-evidence rev-parse HEAD)"
          git -C release-evidence merge-base --is-ancestor "$TAG_SHA" "$EVIDENCE_SHA"
          git merge-base --is-ancestor "$EVIDENCE_SHA" origin/main
          changed="$(git -C release-evidence diff --name-only "$TAG_SHA" "$EVIDENCE_SHA")"
          while IFS= read -r file; do
            # Release-policy changes may follow the frozen product without
            # rebuilding it. Product, packaging and dependency changes remain forbidden.
            [[ -z "$file" || "$file" == docs/benchmarks/v0.5/* || "$file" == "$VALIDATION_PATH" || "$file" == docs/releasing.md || "$file" == scripts/verify-release-evidence.py || "$file" == tests/test_release_evidence.py || "$file" == .github/workflows/release.yml ]] || { echo "Product or packaging change after freeze: $file" >&2; exit 1; }
          done <<< "$changed"
          test -f "release-evidence/$EVIDENCE_PATH"
          echo "EVIDENCE_SHA=$EVIDENCE_SHA" >> "$GITHUB_ENV"
      - name: Test the version-bound release policy from the evidence commit
        working-directory: release-evidence
        run: python3 -m unittest discover -s tests -p test_release_evidence.py
      - uses: actions/download-artifact@v4
        with:
          name: blueberry-windows-x64
          path: release-assets
          run-id: ${{ env.CI_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Normalize the original CI artifact layout
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path('release-assets')
          tag = os.environ['RELEASE_TAG']
          names = [f'blueberry-{tag}-windows-x64.zip', f'blueberry-{tag}-windows-x64.zip.sha256', f'blueberry-{tag}-release.json']
          # upload-artifact retains dist/ci because install.ps1 is also at the repository root.
          # Accept that layout or an already-flat artifact, but never ambiguous duplicates.
          moves = []
          for name in names:
              matches = list(root.rglob(name))
              assert len(matches) == 1 and matches[0].is_file(), f'Missing or ambiguous CI asset: {name}'
              source = matches[0]
              assert source.relative_to(root).as_posix() in (name, 'dist/ci/' + name), f'Unexpected CI asset location: {source}'
              moves.append((source, root / name))
          for source, destination in moves:
              if source != destination:
                  source.rename(destination)
          PY
      - name: Fetch the published beta.6 comparison asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p beta6-public
          gh release download v0.5.0-beta.6 --repo "$GITHUB_REPOSITORY" \
            --pattern 'blueberry-v0.5.0-beta.6-windows-x64.zip' --dir beta6-public
          test -s beta6-public/blueberry-v0.5.0-beta.6-windows-x64.zip
      - name: Validate the exact CI package against every raw performance report
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check "blueberry-$RELEASE_TAG-windows-x64.zip.sha256"
          cd ..
          python3 release-evidence/scripts/verify-release-evidence.py \
            "release-evidence/$EVIDENCE_PATH" \
            "release-assets/blueberry-$RELEASE_TAG-windows-x64.zip" \
            --commit "$TAG_SHA" \
            --ci-run-id "$CI_RUN_ID" \
            --public-beta6-package beta6-public/blueberry-v0.5.0-beta.6-windows-x64.zip \
            --bundle-out "release-assets/blueberry-$RELEASE_TAG-evidence.zip"
      - name: Create or update unpublished draft with the measured bytes
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Published releases are immutable"'
          else
            flags=()
            [[ "$RELEASE_TAG" != *-* ]] || flags+=(--prerelease)
            gh release create "$RELEASE_TAG" --verify-tag --draft "${flags[@]}" --title "Blueberry $RELEASE_TAG" --notes-file release-notes.md
          fi
          find release-assets -maxdepth 1 -type f -print0 | while IFS= read -r -d '' asset; do
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          done
          mkdir -p draft-verification
          gh release download "$RELEASE_TAG" --dir draft-verification
          find release-assets -maxdepth 1 -type f -print0 | while IFS= read -r -d '' asset; do
            cmp "$asset" "draft-verification/$(basename "$asset")"
          done
