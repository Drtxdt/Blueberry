name: Windows Beta validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-compatibility:
    name: pwsh ${{ matrix.pwsh }} / PSReadLine ${{ matrix.psreadline }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Each matrix row downloads and invokes an official stable release in
        # this major/minor family; the runner's preinstalled pwsh is not used
        # as the compatibility target.
        pwsh: ['7.4', '7.5', '7.6']
        psreadline: ['2.3.6', '2.4.5']
    env:
      SHELLSENSE_NO_HISTORY: '1'
      SHELLSENSE_PLANNED_PWSH: ${{ matrix.pwsh }}
      SHELLSENSE_PLANNED_PSREADLINE: ${{ matrix.psreadline }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Download and select official stable PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $planned = $env:SHELLSENSE_PLANNED_PWSH
          $headers = @{ 'User-Agent' = 'ShellSense-Beta-CI' }
          $releases = Invoke-RestMethod `
            -Uri 'https://api.github.com/repos/PowerShell/PowerShell/releases?per_page=100' `
            -Headers $headers
          $release = $releases |
            Where-Object { -not $_.prerelease -and $_.tag_name -match ('^v' + [regex]::Escape($planned) + '\.') } |
            Sort-Object published_at -Descending |
            Select-Object -First 1
          if ($null -eq $release) {
            throw "No stable PowerShell release found for $planned"
          }
          $version = $release.tag_name.TrimStart('v')
          $asset = $release.assets |
            Where-Object { $_.name -eq "PowerShell-$version-win-x64.zip" } |
            Select-Object -First 1
          $hashAsset = $release.assets |
            Where-Object { $_.name -eq 'hashes.sha256' } |
            Select-Object -First 1
          if ($null -eq $asset -or $null -eq $hashAsset) {
            throw "Stable release $($release.tag_name) lacks win-x64 ZIP or hashes.sha256"
          }
          $root = Join-Path $env:RUNNER_TEMP "shellsense-pwsh-$([Guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $root | Out-Null
          $zip = Join-Path $root $asset.name
          $hashes = Join-Path $root 'hashes.sha256'
          Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile $zip
          Invoke-WebRequest -Uri $hashAsset.browser_download_url -Headers $headers -OutFile $hashes
          $hashPattern = '^(?<expected>[0-9a-fA-F]{64})\s+\*?' + [regex]::Escape($asset.name) + '\s*$'
          $expectedHash = $null
          foreach ($hashLine in (Get-Content -LiteralPath $hashes)) {
            $hashMatch = [Text.RegularExpressions.Regex]::Match($hashLine, $hashPattern)
            if ($hashMatch.Success) {
              $expectedHash = $hashMatch.Groups['expected'].Value.ToUpperInvariant()
              break
            }
          }
          if ([string]::IsNullOrWhiteSpace($expectedHash)) {
            throw "hashes.sha256 has no exact entry for $($asset.name)"
          }
          $actualHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "PowerShell ZIP SHA-256 mismatch: expected $expectedHash, got $actualHash"
          }
          $pwshRoot = Join-Path $root 'pwsh'
          Expand-Archive -LiteralPath $zip -DestinationPath $pwshRoot
          $pwshExeItem = Get-ChildItem -LiteralPath $pwshRoot -Filter 'pwsh.exe' -File -Recurse |
            Select-Object -First 1
          if ($null -eq $pwshExeItem) {
            throw "Downloaded PowerShell ZIP did not contain pwsh.exe: $pwshRoot"
          }
          $pwshExe = $pwshExeItem.FullName
          $actualVersion = (& $pwshExe -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()').Trim()
          if (-not $actualVersion.StartsWith("$planned.", [StringComparison]::Ordinal)) {
            throw "PowerShell version mismatch: planned $planned, got $actualVersion"
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path -Parent $pwshExe)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SHELLSENSE_PWSH_EXE=$pwshExe"
          Write-Host "planned=$planned actual=$actualVersion release=$($release.tag_name)"
      - name: Download selected PSReadLine manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $moduleRoot = Join-Path $env:RUNNER_TEMP "shellsense-psreadline-$([Guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $moduleRoot | Out-Null
          Save-Module -Name PSReadLine -RequiredVersion $env:SHELLSENSE_PLANNED_PSREADLINE `
            -Path $moduleRoot -Repository PSGallery -Force
          $manifest = Get-ChildItem -LiteralPath $moduleRoot -Filter 'PSReadLine.psd1' -File -Recurse |
            Select-Object -First 1
          if ($null -eq $manifest) { throw 'PSReadLine.psd1 was not downloaded' }
          $probe = (& $env:SHELLSENSE_PWSH_EXE -NoLogo -NoProfile -NonInteractive -Command `
              "Import-Module -Name '$($manifest.FullName.Replace("'", "''"))' -Force; (Get-Module PSReadLine).Version.ToString()" ).Trim()
          if ($probe -ne $env:SHELLSENSE_PLANNED_PSREADLINE) {
            throw "PSReadLine version mismatch: planned $env:SHELLSENSE_PLANNED_PSREADLINE, got $probe"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SHELLSENSE_TEST_PSREADLINE_MODULE=$($manifest.FullName)"
          Write-Host "PSReadLine=$probe manifest=$($manifest.FullName)"
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --locked -- --test-threads=1
      - name: Private pipe terminal regressions
        shell: pwsh
        run: |
          $env:SHELLSENSE_TEST_TRANSPORT = 'pipe'
          cargo test --locked --test terminal_beta -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Private pipe terminal regressions failed' }
      - name: PowerShell adapter tests
        shell: pwsh
        run: |
          $manifest = $env:SHELLSENSE_TEST_PSREADLINE_MODULE.Replace("'", "''")
          $test = (Join-Path $PWD 'tests\adapter.tests.ps1').Replace("'", "''")
          & $env:SHELLSENSE_PWSH_EXE -NoLogo -NoProfile -NonInteractive -Command `
            "Import-Module -Name '$manifest' -Force; & '$test'"
          if (-not $?) { throw 'PowerShell adapter tests failed' }

  package:
    name: Build and inspect Windows x64 package
    runs-on: windows-latest
    needs: powershell-compatibility
    steps:
      - uses: actions/checkout@v4
      - name: Select Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Build release executable
        run: cargo build --release --locked
      - name: Collect dependency license text
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File .\scripts\licenses.ps1 -OutputPath .\THIRD-PARTY-NOTICES.txt
      - name: Package existing executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionMatch = Select-String -LiteralPath Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1
          $version = $versionMatch.Matches.Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Cargo.toml version not found' }
          & .\scripts\release.ps1 `
            -ExePath .\target\release\shellsense.exe `
            -Version $version `
            -OutputDirectory .\dist\ci
      - name: Test package installation and rollback
        shell: pwsh
        run: |
          & .\scripts\test-release.ps1 -ShellSenseExecutable .\target\release\shellsense.exe
          if (-not $?) { throw 'Package lifecycle regressions failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: shellsense-windows-x64-beta
          path: |
            dist/ci/*.zip
            dist/ci/*.sha256
            dist/ci/*-release.json
          if-no-files-found: error

# Public GitHub Release creation, signing, and pushing are intentionally
# absent. A reviewed human release operation consumes the artifact above.
